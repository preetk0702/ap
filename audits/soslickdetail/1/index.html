  :root {
    --teal-dark: #2E7E78;
    --teal: #3D9B92;
    --teal-light: #6DBEB0;
    --teal-tint: #E6F2F0;
    --ink: #1A1A1A;
    --ink-soft: #3A3A3A;
    --grey: #6B6B6B;
    --grey-light: #D9D9D9;
    --bg: #F5F8F8;
    --red: #D04444;
    --shadow: 0 12px 40px rgba(46, 126, 120, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 60%, var(--teal-light) 100%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ Header (shared) ============ */
  header.top {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: var(--teal-dark);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
    border-bottom: 2px solid var(--teal-light);
  }
  header.top .brand {
    display: flex; align-items: center; gap: 10px;
    color: white;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 14px;
  }
  header.top .brand .mark {
    width: 28px; height: 28px;
    border: 2px solid var(--teal-light);
    border-radius: 5px;
    position: relative;
    flex-shrink: 0;
  }
  header.top .brand .mark::before {
    content: ""; position: absolute;
    top: 5px; left: 3px; right: 3px; height: 2px;
    background: var(--teal-light);
  }
  header.top .brand .mark::after {
    content: ""; position: absolute;
    bottom: 3px; right: 3px;
    width: 8px; height: 14px;
    border: 2px solid var(--teal-light);
    border-radius: 2px;
    background: var(--teal-dark);
  }
  header.top .meta {
    color: var(--teal-light);
    font-size: 12px;
    font-weight: 500;
  }

  /* ============ Gate ============ */

    min-height: 100vh;
    padding-top: 56px;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 40px;
  }
  .gate {
    background: white;
    border-radius: 18px;
    box-shadow: var(--shadow);
    width: min(440px, calc(100% - 32px));
    padding: 40px 36px 32px;
    text-align: center;
  }
  .gate .logo-icon {
    width: 72px; height: 72px;
    margin: 0 auto 18px;
    border: 3px solid var(--teal);
    border-radius: 12px;
    position: relative;
  }
  .gate .logo-icon::before {
    content: ""; position: absolute;
    top: 10px; left: 8px; right: 8px; height: 3px;
    background: var(--teal);
  }
  .gate .logo-icon::after {
    content: ""; position: absolute;
    bottom: 8px; right: 6px;
    width: 22px; height: 36px;
    border: 3px solid var(--teal);
    border-radius: 5px;
    background: white;
  }
  .gate .eyebrow {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--teal);
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .gate h1 {
    margin: 0 0 6px;
    font-size: 24px;
    color: var(--ink);
    letter-spacing: -0.3px;
  }
  .gate .sub {
    color: var(--grey);
    font-size: 14px;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .gate form {
    display: flex; flex-direction: column; gap: 12px;
  }
  .gate label {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: var(--grey);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--grey-light);
    border-radius: 10px;
    font-size: 15px;
    color: var(--ink);
    background: var(--bg);
    transition: border-color 0.15s, background 0.15s;
    font-family: inherit;
  }

    outline: none;
    border-color: var(--teal);
    background: white;
    box-shadow: 0 0 0 4px rgba(61, 155, 146, 0.12);
  }
