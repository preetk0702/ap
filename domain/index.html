<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Available | apweb.tech</title>
  <meta name="description" content="This domain is available to buy. AP Web can also build a custom website for this domain.">
  <link rel="canonical" href="https://apweb.tech/domain">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050811;
      --panel:#0b1020;
      --accent:#6cf2c2;
      --accent2:#5b8cff;
      --text:#eef1f7;
      --muted:#9aa4bf;
    }

    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}

    body{
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(70% 90% at 15% 10%, rgba(108,242,194,.17), transparent 60%),
        radial-gradient(70% 90% at 85% 90%, rgba(91,140,255,.2), transparent 62%),
        var(--bg);
      display:grid;
      place-items:center;
      padding:28px;
    }

    .panel{
      width:min(760px,100%);
      background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.14);
      border-radius:24px;
      padding:48px;
      backdrop-filter:blur(14px);
      box-shadow:0 28px 70px rgba(0,0,0,.45);
    }

    .badge{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      font-size:.8rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      background:rgba(108,242,194,.14);
      border:1px solid rgba(108,242,194,.35);
      color:var(--accent);
      font-weight:700;
      margin-bottom:20px;
    }

    h1{
      font-size:clamp(2rem,4.8vw,3.2rem);
      line-height:1.1;
      margin-bottom:16px;
    }

    .lead{
      font-size:1.14rem;
      color:var(--muted);
      line-height:1.7;
      margin-bottom:28px;
    }

    .cta{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      border-radius:12px;
      padding:14px 20px;
      font-weight:700;
      transition:transform .2s ease, box-shadow .2s ease;
    }

    .btn-primary{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#050811;
    }

    .btn-secondary{
      border:1px solid rgba(255,255,255,.2);
      color:var(--text);
      background:rgba(255,255,255,.04);
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 22px rgba(0,0,0,.3);
    }

    .footer-note{
      margin-top:24px;
      color:var(--muted);
      font-size:.92rem;
    }

    @media (max-width:640px){
      .panel{padding:32px 24px}
    }
  </style>
</head>
<body>
  <main class="panel">
    <p class="badge">apweb.tech</p>
    <h1>This domain is available to buy.</h1>
    <p class="lead">
      AP Web is able to build a professional website for you on this domain.
      Please contact <strong>domain@apweb.tech</strong> for more information.
    </p>
    <div class="cta">
      <a class="btn btn-primary" href="mailto:domain@apweb.tech">Email domain@apweb.tech</a>
      <a class="btn btn-secondary" href="https://apweb.tech/">Visit apweb.tech</a>
    </div>
    <p class="footer-note">Fast setup • Professional design • Ongoing support</p>
  </main>
</body>
</html>
