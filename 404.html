<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | APWEB.TECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #3d5a5e;       /* The deep slate/teal background from your logo */
            --accent-color: #79c2b4;   /* The bright teal line art color */
            --text-main: #ffffff;      /* Clean white for main headings */
            --text-muted: #b2cbca;     /* Soft teal-tinted white for descriptions */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        /* Glitchy Tech Header Style */
        .error-code {
            font-family: 'Share Tech Mono', monospace;
            font-size: 6rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
            position: relative;
            display: inline-block;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Styled button matching your logo layout */
        .btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(121, 194, 180, 0.1);
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 25px rgba(121, 194, 180, 0.3);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Auto-redirect note */
        .redirect-notice {
            margin-top: 40px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent-color);
            opacity: 0.8;
        }

        #countdown {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        
        <h1>Page Not Found</h1>
        
        <p>Oops! We searched far and wide, but this page isn't built yet. The link might be broken, or the path could have changed.</p>
        
        <a href="https://apweb.tech" class="btn">Return to Homepage</a>
        
        <div class="redirect-notice">
            SYSTEM: Redirecting home automatically in <span id="countdown">10</span>s...
        </div>
    </div>

    <script>
        // Set the countdown timer
        let timeLeft = 10;
        const countdownElement = document.getElementById('countdown');

        const downloadTimer = setInterval(function(){
            if(timeLeft <= 1) {
                clearInterval(downloadTimer);
                window.location.href = "https://apweb.tech";
            }
            timeLeft -= 1;
            countdownElement.textContent = timeLeft;
        }, 1000);
    </script>

</body>
</html>
