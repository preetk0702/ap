<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | APWEB.TECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #3d5a5e;       /* The deep slate/teal background */
            --accent-color: #79c2b4;   /* The bright teal brand color */
            --text-main: #ffffff;      
            --text-muted: #b2cbca;     
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        /* Brand Header Layout */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .brand-logo {
            width: 90px;
            height: auto;
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-text {
            text-align: left;
        }

        .brand-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.8rem;
            color: var(--accent-color);
            line-height: 1;
            letter-spacing: 1px;
        }

        .brand-tagline {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 2px;
            text-transform: uppercase;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-color), transparent);
            margin: 20px 0 40px 0;
            opacity: 0.4;
        }

        /* Error Text Styling */
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* Interactive Button */
        .btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(121, 194, 180, 0.4);
            transform: translateY(-2px);
        }

        /* System footer */
        .system-status {
            margin-top: 50px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent-color);
            opacity: 0.7;
        }

        /* Responsive tweak for smaller mobile screens */
        @media (max-width: 480px) {
            .brand-header {
                flex-direction: column;
                gap: 10px;
            }
            .brand-text {
                text-align: center;
            }
            .brand-title {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="brand-header">
            <svg class="brand-logo" viewBox="0 0 100 70">
                <rect x="5" y="5" width="75" height="55" rx="4" />
                <line x1="5" y1="16" x2="80" y2="16" />
                <circle cx="12" cy="10" r="1.5" />
                <circle cx="18" cy="10" r="1.5" />
                <circle cx="24" cy="10" r="1.5" />
                <rect x="60" y="25" width="22" height="40" rx="4" fill="#3d5a5e" />
                <circle cx="71" cy="60" r="1.5" />
            </svg>
            
            <div class="brand-text">
                <div class="brand-title">APWEB.TECH</div>
                <div class="brand-tagline">Built For Results</div>
            </div>
        </div>

        <div class="divider"></div>
        
        <h1>404 - Page Not Found</h1>
        <p>Oops! We searched far and wide, but this result is still built... for later.<br>The page you are looking for has been moved or does not exist.</p>
        
        <a href="https://apweb.tech" class="btn">Return to Homepage</a>
        
        <div class="system-status">
            STATUS: Redirecting to main node in <span id="timer">10</span>s...
        </div>
    </div>

    <script>
        let seconds = 10;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(function() {
            seconds--;
            timerElement.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = "https://apweb.tech";
            }
        }, 1000);
    </script>

</body>
</html>
