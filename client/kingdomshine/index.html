<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>AP Web | Kingdom Shine – Client Portal</title>
<style>
  :root {
    --teal-dark: #2E7E78;
    --teal:      #3D9B92;
    --teal-light:#6DBEB0;
    --teal-tint: #E6F2F0;
    --ink:       #1A1A1A;
    --ink-soft:  #3A3A3A;
    --grey:      #6B6B6B;
    --grey-light:#D9D9D9;
    --bg:        #F5F8F8;
    --red:       #D04444;
    --green:     #2E7E78;
    --shadow:    0 12px 40px rgba(46,126,120,.18);
    --header-h:  56px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--teal-dark) 0%,var(--teal) 60%,var(--teal-light) 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ── Header ─────────────────────────────────── */
  header{
    position:fixed;top:0;left:0;right:0;
    height:var(--header-h);
    background:var(--teal-dark);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;z-index:200;
    border-bottom:2px solid var(--teal-light);
  }
  .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:14px;letter-spacing:.5px}
  .mark{width:28px;height:28px;border:2px solid var(--teal-light);border-radius:5px;position:relative;flex-shrink:0}
  .mark::before{content:"";position:absolute;top:5px;left:3px;right:3px;height:2px;background:var(--teal-light)}
  .mark::after{content:"";position:absolute;bottom:3px;right:3px;width:8px;height:14px;border:2px solid var(--teal-light);border-radius:2px;background:var(--teal-dark)}
  .meta{color:var(--teal-light);font-size:12px;font-weight:500}

  /* ── Gate ───────────────────────────────────── */
  #gateWrap{
    min-height:100vh;padding-top:var(--header-h);
    display:flex;align-items:center;justify-content:center;padding-bottom:40px;
  }
  .gate{
    background:#fff;border-radius:18px;box-shadow:var(--shadow);
    width:min(440px,calc(100% - 32px));padding:40px 36px 32px;text-align:center;
  }
  .gate-icon{
    width:72px;height:72px;margin:0 auto 18px;
    border:3px solid var(--teal);border-radius:12px;position:relative;
  }
  .gate-icon::before{content:"";position:absolute;top:10px;left:8px;right:8px;height:3px;background:var(--teal)}
  .gate-icon::after{content:"";position:absolute;bottom:8px;right:6px;width:22px;height:36px;border:3px solid var(--teal);border-radius:5px;background:#fff}
  .eyebrow{font-size:11px;letter-spacing:2px;color:var(--teal);font-weight:700;text-transform:uppercase;margin-bottom:8px}
  .gate h1{font-size:24px;color:var(--ink);letter-spacing:-.3px;margin-bottom:6px}
  .gate .sub{color:var(--grey);font-size:14px;margin-bottom:28px;line-height:1.5}
  .gate form{display:flex;flex-direction:column;gap:12px}
  .gate label{text-align:left;font-size:12px;font-weight:600;color:var(--grey);text-transform:uppercase;letter-spacing:.6px}
  .gate input[type="password"]{
    width:100%;padding:14px 16px;border:1.5px solid var(--grey-light);border-radius:10px;
    font-size:15px;color:var(--ink);background:var(--bg);font-family:inherit;
    transition:border-color .15s,background .15s;
  }
  .gate input[type="password"]:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(61,155,146,.12)}
  .gate button[type="submit"]{
    margin-top:6px;padding:14px;border:0;border-radius:10px;
    background:var(--teal-dark);color:#fff;font-weight:700;font-size:15px;
    letter-spacing:.3px;cursor:pointer;transition:background .15s,transform .05s;font-family:inherit;
  }
  .gate button[type="submit"]:hover{background:var(--teal)}
  .gate button[type="submit"]:active{transform:translateY(1px)}
  .err{color:var(--red);font-size:13px;margin-top:4px;text-align:left;min-height:18px;font-weight:500}
  .gate .foot{margin-top:22px;font-size:12px;color:var(--grey);border-top:1px solid var(--grey-light);padding-top:16px}
  .gate .foot a{color:var(--teal-dark);text-decoration:none;font-weight:600}
  .gate .foot a:hover{text-decoration:underline}

  /* ── Explorer ───────────────────────────────── */
  #explorer{display:none}
  #explorer.active{display:block}

  .exp-bar{
    position:fixed;top:var(--header-h);left:0;right:0;
    height:56px;background:#fff;border-bottom:1px solid var(--grey-light);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;z-index:150;
  }
  .exp-bar .info .label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--teal);font-weight:700}
  .exp-bar .info .title{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2}
  .exp-bar .lock-btn{
    background:var(--bg);color:var(--ink-soft);border:1px solid var(--grey-light);
    border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;
    font-family:inherit;transition:background .15s;
  }
  .exp-bar .lock-btn:hover{background:var(--teal-tint);border-color:var(--teal-light)}

  .exp-body{
    padding-top:calc(var(--header-h) + 56px + 24px);
    padding-bottom:40px;
    min-height:100vh;
  }

  .exp-inner{max-width:860px;margin:0 auto;padding:0 20px}

  .exp-loading{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 20px;color:rgba(255,255,255,.85);gap:14px;font-size:14px;font-weight:500;
  }
  .spinner{
    width:36px;height:36px;border:3px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .exp-error{
    background:#fff;border-radius:14px;padding:32px;text-align:center;
    color:var(--grey);font-size:14px;box-shadow:var(--shadow);
  }
  .exp-error strong{color:var(--ink);display:block;margin-bottom:8px;font-size:16px}

  .file-table{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}

  .file-header{
    display:grid;grid-template-columns:1fr 100px 140px;
    padding:12px 20px;background:var(--teal-tint);border-bottom:1px solid var(--grey-light);
    font-size:11px;font-weight:700;color:var(--teal-dark);text-transform:uppercase;letter-spacing:.8px;
  }

  .file-row{
    display:grid;grid-template-columns:1fr 100px 140px;
    padding:14px 20px;border-bottom:1px solid var(--bg);
    align-items:center;transition:background .12s;
  }
  .file-row:last-child{border-bottom:none}
  .file-row:hover{background:var(--bg)}

  .file-name{display:flex;align-items:center;gap:12px;min-width:0}
  .file-icon{font-size:22px;flex-shrink:0;line-height:1}
  .file-text{min-width:0}
  .file-text .fname{
    font-weight:600;font-size:14px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .file-text .fext{font-size:11px;color:var(--grey);text-transform:uppercase;font-weight:500;margin-top:2px}
  .file-size{font-size:13px;color:var(--grey);font-weight:500}

  .file-actions{display:flex;gap:8px;justify-content:flex-end}
  .btn-view,.btn-dl{
    text-decoration:none;border:0;cursor:pointer;font-family:inherit;
    border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;transition:all .12s;
  }
  .btn-view{background:var(--teal-dark);color:#fff}
  .btn-view:hover{background:var(--teal)}
  .btn-dl{background:var(--bg);color:var(--ink-soft);border:1px solid var(--grey-light)}
  .btn-dl:hover{background:var(--teal-tint);border-color:var(--teal-light)}

  .empty-state{
    padding:60px 20px;text-align:center;color:var(--grey);font-size:14px;
  }
  .empty-state .big{font-size:40px;margin-bottom:12px}

  /* ── Viewer ─────────────────────────────────── */
  #viewer{display:none}
  #viewer.active{display:block}

  .viewer-bar{
    position:fixed;top:var(--header-h);left:0;right:0;
    height:56px;background:#fff;border-bottom:1px solid var(--grey-light);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;z-index:150;
  }
  .viewer-bar .left{display:flex;align-items:center;gap:14px}
  .back-btn{
    background:var(--bg);color:var(--ink-soft);border:1px solid var(--grey-light);
    border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;
    font-family:inherit;transition:background .15s;white-space:nowrap;
  }
  .back-btn:hover{background:var(--teal-tint);border-color:var(--teal-light)}
  .viewer-bar .title-block .t-eye{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--teal);font-weight:700}
  .viewer-bar .title-block .t-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .viewer-bar .right{display:flex;gap:8px}
  .viewer-bar .right a{
    text-decoration:none;border:0;cursor:pointer;font-family:inherit;
    border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;transition:all .12s;
    background:var(--bg);color:var(--ink-soft);border:1px solid var(--grey-light);
  }
  .viewer-bar .right a:hover{background:var(--teal-tint);border-color:var(--teal-light)}
  .viewer-bar .right a.primary{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark)}
  .viewer-bar .right a.primary:hover{background:var(--teal);border-color:var(--teal)}

  .frame-wrap{
    position:fixed;top:calc(var(--header-h) + 56px);left:0;right:0;bottom:0;
    background:#2A2A2A;padding:16px;overflow:auto;-webkit-overflow-scrolling:touch;
  }
  .frame-wrap object,.frame-wrap embed,.frame-wrap img.inline-img{
    width:100%;height:100%;border:0;border-radius:8px;
    background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.4);display:block;
  }
  .frame-wrap img.inline-img{object-fit:contain;background:#1a1a1a}

  /* ── Responsive ─────────────────────────────── */
  @media(max-width:640px){
    .file-header{grid-template-columns:1fr 90px}
    .file-row{grid-template-columns:1fr 90px}
    .file-size{display:none}
    .file-header .h-size{display:none}
    .viewer-bar .title-block .t-name{max-width:140px}
    .exp-inner{padding:0 12px}
    .gate{padding:32px 24px 24px}
    .frame-wrap{padding:0;background:#fff}
    .frame-wrap object,.frame-wrap embed{border-radius:0;box-shadow:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark"></span><span>AP WEB.TECH</span></div>
  <div class="meta" id="headerMeta">Client Portal</div>
</header>

<!-- ── Gate ──────────────────────────────────── -->
<div id="gateWrap">
  <div class="gate">
    <div class="gate-icon" aria-hidden="true"></div>
    <div class="eyebrow">Private Client Portal</div>
    <h1 id="gateTitle">Kingdom Shine</h1>
    <div class="sub">Enter the access password provided by AP Web to view your files.</div>
    <form id="gateForm" autocomplete="off">
      <label for="pw">Access Password</label>
      <input id="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required />
      <div class="err" id="err" role="alert"></div>
      <button type="submit">Unlock Portal</button>
    </form>
    <div class="foot">Questions? <a href="mailto:contact@apweb.tech">contact@apweb.tech</a></div>
  </div>
</div>

<!-- ── File Explorer ──────────────────────────── -->
<div id="explorer">
  <div class="exp-bar">
    <div class="info">
      <div class="label">Client Files</div>
      <div class="title" id="expTitle">Kingdom Shine</div>
    </div>
    <button class="lock-btn" onclick="lockPortal()">🔒 Lock</button>
  </div>
  <div class="exp-body">
    <div class="exp-inner" id="expInner">
      <div class="exp-loading" id="expLoading">
        <div class="spinner"></div>
        <span>Loading your files…</span>
      </div>
    </div>
  </div>
</div>

<!-- ── Viewer ─────────────────────────────────── -->
<div id="viewer">
  <div class="viewer-bar">
    <div class="left">
      <button class="back-btn" onclick="closeViewer()">← Back</button>
      <div class="title-block">
        <div class="t-eye">Viewing</div>
        <div class="t-name" id="viewerName"></div>
      </div>
    </div>
    <div class="right">
      <a id="viewerDl" href="#" download>Download</a>
      <a id="viewerNew" href="#" target="_blank" rel="noopener" class="primary">Open in New Tab</a>
    </div>
  </div>
  <div class="frame-wrap" id="frameWrap"></div>
</div>

<script>
// ─── Config (edit these per client) ───────────────────────────────────────────
const CFG = {
  clientName:   "Kingdom Shine",
  clientShort:  "kingdomshine",            // folder name under /client/
  githubRepo:   "preetk0702/ap",       // owner/repo
  // SHA-256 of password. Current password: kingdom2026
  passwordHash: "42e180c3321ced30bab6c220396b1935d6e8e9b895b9ebf07cc64002d5afcb93",
  sessionKey:   "apweb_unlocked_kingdomshine",
};
// ─────────────────────────────────────────────────────────────────────────────

const GITHUB_API = `https://api.github.com/repos/${CFG.githubRepo}/contents/client/${CFG.clientShort}`;

// ── Helpers ──────────────────────────────────────────────────────────────────
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function fileIcon(name) {
  const ext = name.split(".").pop().toLowerCase();
  const map = {
    pdf:"📄", png:"🖼️", jpg:"🖼️", jpeg:"🖼️", gif:"🖼️", webp:"🖼️", svg:"🖼️",
    mp4:"🎬", mov:"🎬", avi:"🎬", mkv:"🎬",
    mp3:"🎵", wav:"🎵", m4a:"🎵",
    doc:"📝", docx:"📝", txt:"📝",
    xls:"📊", xlsx:"📊", csv:"📊",
    zip:"📦", rar:"📦", "7z":"📦",
    ppt:"📋", pptx:"📋",
  };
  return map[ext] || "📎";
}

function fileLabel(name) {
  const ext = name.split(".").pop().toLowerCase();
  const labels = {
    pdf:"PDF Document", png:"PNG Image", jpg:"JPEG Image", jpeg:"JPEG Image",
    gif:"GIF Image", webp:"WebP Image", svg:"SVG Image",
    mp4:"MP4 Video", mov:"QuickTime Video", doc:"Word Document", docx:"Word Document",
    xls:"Excel Spreadsheet", xlsx:"Excel Spreadsheet", csv:"CSV Spreadsheet",
    ppt:"PowerPoint", pptx:"PowerPoint", zip:"ZIP Archive", txt:"Text File",
  };
  return labels[ext] || ext.toUpperCase() + " File";
}

function isViewable(name) {
  const ext = name.split(".").pop().toLowerCase();
  return ["pdf","png","jpg","jpeg","gif","webp","svg"].includes(ext);
}

function isImage(name) {
  const ext = name.split(".").pop().toLowerCase();
  return ["png","jpg","jpeg","gif","webp","svg"].includes(ext);
}

function formatSize(bytes) {
  if (!bytes) return "—";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/(1024*1024)).toFixed(1) + " MB";
}

// ── Gate ─────────────────────────────────────────────────────────────────────
document.getElementById("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  if (!pw) return;

  const h = await sha256(pw);
  if (h === CFG.passwordHash) {
    try { sessionStorage.setItem(CFG.sessionKey, "1"); } catch(e) {}
    showExplorer();
  } else {
    err.textContent = "Incorrect password. Contact contact@apweb.tech for help.";
    document.getElementById("pw").select();
  }
});

// Auto-unlock if same session
try {
  if (sessionStorage.getItem(CFG.sessionKey) === "1") showExplorer();
} catch(e) {}

// ── Explorer ─────────────────────────────────────────────────────────────────
function showExplorer() {
  document.getElementById("gateWrap").style.display = "none";
  document.getElementById("viewer").classList.remove("active");
  document.getElementById("viewer").style.display = "none";
  document.getElementById("explorer").style.display = "block";
  document.getElementById("explorer").classList.add("active");
  document.getElementById("headerMeta").textContent = CFG.clientName;
  loadFiles();
}

async function loadFiles() {
  const inner = document.getElementById("expInner");
  inner.innerHTML = `<div class="exp-loading"><div class="spinner"></div><span>Loading your files…</span></div>`;

  try {
    const res = await fetch(GITHUB_API, {
      headers: { "Accept": "application/vnd.github.v3+json" }
    });

    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const items = await res.json();

    // Filter: only files, skip index.html and dotfiles
    const files = items.filter(f =>
      f.type === "file" &&
      f.name !== "index.html" &&
      !f.name.startsWith(".")
    );

    if (files.length === 0) {
      inner.innerHTML = `
        <div class="file-table">
          <div class="empty-state">
            <div class="big">📂</div>
            <strong>No files yet</strong><br>
            Files uploaded to this folder will appear here.
          </div>
        </div>`;
      return;
    }

    // Sort: folders first, then by name
    files.sort((a,b) => a.name.localeCompare(b.name));

    let rows = files.map(f => {
      const viewable = isViewable(f.name);
      const rawUrl   = f.download_url;
      const viewBtn  = viewable
        ? `<button class="btn-view" onclick="openViewer('${esc(f.name)}','${esc(rawUrl)}')">View</button>`
        : "";
      return `
        <div class="file-row">
          <div class="file-name">
            <span class="file-icon">${fileIcon(f.name)}</span>
            <div class="file-text">
              <div class="fname">${esc(f.name)}</div>
              <div class="fext">${fileLabel(f.name)}</div>
            </div>
          </div>
          <div class="file-size h-size">${formatSize(f.size)}</div>
          <div class="file-actions">
            ${viewBtn}
            <a class="btn-dl" href="${esc(rawUrl)}" download="${esc(f.name)}">Download</a>
          </div>
        </div>`;
    }).join("");

    inner.innerHTML = `
      <div class="file-table">
        <div class="file-header">
          <div>Name</div>
          <div class="h-size">Size</div>
          <div></div>
        </div>
        ${rows}
      </div>`;

  } catch (err) {
    inner.innerHTML = `
      <div class="exp-error">
        <strong>Couldn't load files</strong>
        Could not reach the file list. Check your connection and try refreshing.
        <br><br>
        <button class="btn-view" onclick="loadFiles()" style="border:0;cursor:pointer;">Retry</button>
      </div>`;
    console.error(err);
  }
}

function esc(str) {
  return String(str).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function lockPortal() {
  try { sessionStorage.removeItem(CFG.sessionKey); } catch(e) {}
  document.getElementById("explorer").classList.remove("active");
  document.getElementById("explorer").style.display = "none";
  document.getElementById("gateWrap").style.display = "flex";
  document.getElementById("pw").value = "";
  document.getElementById("err").textContent = "";
}

// ── Viewer ───────────────────────────────────────────────────────────────────
function openViewer(name, url) {
  document.getElementById("explorer").style.display = "none";
  document.getElementById("viewer").style.display = "block";
  document.getElementById("viewer").classList.add("active");
  document.getElementById("viewerName").textContent = name;
  document.getElementById("viewerDl").href = url;
  document.getElementById("viewerDl").download = name;
  document.getElementById("viewerNew").href = url;

  const wrap = document.getElementById("frameWrap");
  if (isImage(name)) {
    wrap.innerHTML = `<img class="inline-img" src="${esc(url)}" alt="${esc(name)}" />`;
  } else {
    // PDF
    wrap.innerHTML = `
      <object data="${esc(url)}#view=FitH" type="application/pdf" title="${esc(name)}">
        <embed src="${esc(url)}#view=FitH" type="application/pdf" />
        <p style="color:#fff;text-align:center;padding:40px">
          Your browser can't show this inline.
          <a href="${esc(url)}" target="_blank" style="color:#6DBEB0">Open in a new tab →</a>
        </p>
      </object>`;
  }
}

function closeViewer() {
  document.getElementById("viewer").classList.remove("active");
  document.getElementById("viewer").style.display = "none";
  document.getElementById("frameWrap").innerHTML = "";
  showExplorer();
}
</script>
</body>
</html>
